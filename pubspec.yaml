name: agenda_tarefas
description: App simples de tarefas com login e CRUD em SQLite.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  sqflite: ^2.3.3   # banco de dados SQLite
  path: ^1.9.0      # monta o caminho do arquivo do banco
  crypto: ^3.0.3    # transforma a senha em hash
  sqflite_common_ffi_web: ^1.2.2  # SQLite no navegador (versão web)

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
